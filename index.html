                var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 18px 64px;
  }
  .wrap { width: 100%; max-width: 880px; }
  header { text-align: center; margin-bottom: 28px; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    background: rgba(255,255,255,.02);
    padding: 6px 12px; border-radius: 999px;
  }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-2); box-shadow: 0 0 12px var(--accent-2); }
  h1 { font-size: clamp(26px, 4vw, 40px); margin: 16px 0 8px; font-weight: 800; letter-spacing: -.02em; }
  h1 .grad {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { color: var(--muted); margin: 0; font-size: 15px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: linear-gradient(180deg, var(--card) 0%, var(--bg-soft) 100%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    opacity: .9;
  }
  .card.v6::before { background: linear-gradient(90deg, #a78bfa, #22d3ee); }

  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .proto { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
  .proto .chip {
    font-size: 11px; font-weight: 700; letter-spacing: .08em;
    padding: 3px 8px; border-radius: 6px;
    background: rgba(79,140,255,.16); color: #9cc0ff; border: 1px solid rgba(79,140,255,.3);
  }
  .card.v6 .proto .chip { background: rgba(167,139,250,.16); color: #c9b8ff; border-color: rgba(167,139,250,.3); }

  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .status .s-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); }
  .status.ok .s-dot { background: var(--good); box-shadow: 0 0 10px var(--good); }
  .status.err .s-dot { background: var(--bad); box-shadow: 0 0 10px var(--bad); }

  .ip {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: clamp(18px, 3.4vw, 26px);
    font-weight: 700;
    word-break: break-all;
    background: rgba(0,0,0,.25);
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 16px;
    min-height: 60px;
    display: flex; align-items: center;
    user-select: all;
  }
  .ip.loading { color: var(--muted); font-weight: 500; font-size: 15px; }
  .ip.none { color: var(--warn); font-weight: 600; font-size: 15px; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 13.5px; }
  .row:last-child { border-bottom: 0; }
  .row .k { color: var(--muted); }
  .row .val { text-align: right; font-weight: 600; word-break: break-word; }
  .details { margin-top: 14px; opacity: 0; transition: opacity .3s ease; }
  .details.show { opacity: 1; }

  .actions { display: flex; gap: 10px; margin-top: 14px; }
  button {
    cursor: pointer; font: inherit; font-weight: 600; font-size: 13px;
    border: 1px solid var(--line); background: var(--card-2); color: var(--text);
    padding: 9px 14px; border-radius: 10px; transition: all .15s ease;
    display: inline-flex; align-items: center; gap: 7px;
  }
  button:hover { border-color: var(--accent); background: #20305f; }
  button:active { transform: translateY(1px); }
  button.copied { border-color: var(--good); color: var(--good); }

  .toolbar { display: flex; justify-content: center; margin: 26px 0 10px; }
  .refresh { padding: 11px 22px; background: linear-gradient(90deg, var(--accent), #3b6fe0); border: 0; }
  .refresh:hover { filter: brightness(1.08); }

  .spin { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.2); border-top-color: var(--accent-2); border-radius: 50%; display: inline-block; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="badge"><span class="dot"></span> Live IP Reflection</span>
      <h1>What Is My <span class="grad">IP Address?</span></h1>
      <p>Detects your public <strong>IPv4</strong> and <strong>IPv6</strong> by reflecting your real connection.</p>
    </header>

    <div class="grid">
      <!-- IPv4 -->
      <section class="card v4">
        <div class="card-head">
          <div class="proto"><span class="chip">IPv4</span> Public Address</div>
          <div class="status" id="status-v4"><span class="s-dot"></span><span id="status-v4-text">checking…</span></div>
        </div>
        <div class="ip loading" id="ip-v4"><span class="spin"></span>&nbsp; resolving…</div>
        <div class="actions">
          <button id="copy-v4" disabled>📋 Copy</button>
        </div>
        <div class="details" id="details-v4"></div>
      </section>

      <!-- IPv6 -->
      <section class="card v6">
        <div class="card-head">
          <div class="proto"><span class="chip">IPv6</span> Public Address</div>
          <div class="status" id="status-v6"><span class="s-dot"></span><span id="status-v6-text">checking…</span></div>
        </div>
        <div class="ip loading" id="ip-v6"><span class="spin"></span>&nbsp; resolving…</div>
        <div class="actions">
          <button id="copy-v6" disabled>📋 Copy</button>
        </div>
        <div class="details" id="details-v6"></div>
      </section>
    </div>

    <div class="toolbar">
      <button class="refresh" id="refresh">↻ Re-check my IP</button>
    </div>

  </div>

<script>
(function () {
  "use strict";

  var ENDPOINTS = {
    v4: "https://api4.ipify.org?format=json",
    v6: "https://api6.ipify.org?format=json"
  };
  var TIMEOUT_MS = 9000;

  function $(id) { return document.getElementById(id); }

  function fetchWithTimeout(url, ms) {
    var ctrl = new AbortController();
    var t = setTimeout(function () { ctrl.abort(); }, ms);
    return fetch(url, { signal: ctrl.signal, cache: "no-store" })
      .then(function (r) {
        clearTimeout(t);
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .catch(function (e) { clearTimeout(t); throw e; });
  }

  function setStatus(proto, state, text) {
    var el = $("status-" + proto);
    el.className = "status" + (state ? " " + state : "");
    $("status-" + proto + "-text").textContent = text;
  }

  function rowsFromInfo(info) {
    if (!info || info.success === false) return "";
    var conn = info.connection || {};
    var tz = info.timezone || {};
    var pairs = [
      ["ISP", conn.isp || conn.org || "—"],
      ["ASN", conn.asn ? ("AS" + conn.asn) : "—"],
      ["City", info.city || "—"],
      ["Region", info.region || "—"],
      ["Country", (info.flag && info.flag.emoji ? info.flag.emoji + " " : "") + (info.country || "—")],
      ["Timezone", tz.id ? (tz.id + (tz.utc ? " (" + tz.utc + ")" : "")) : "—"]
    ];
    var html = "";
    for (var i = 0; i < pairs.length; i++) {
      html += '<div class="row"><span class="k">' + pairs[i][0] +
              '</span><span class="val">' + escapeHtml(String(pairs[i][1])) + "</span></div>";
    }
    return html;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function enrich(proto, ip) {
    fetchWithTimeout("https://ipwho.is/" + encodeURIComponent(ip), TIMEOUT_MS)
      .then(function (info) {
        var box = $("details-" + proto);
        var html = rowsFromInfo(info);
        if (html) { box.innerHTML = html; box.classList.add("show"); }
      })
      .catch(function () { /* enrichment is optional */ });
  }

  function showIp(proto, ip) {
    var el = $("ip-" + proto);
    el.className = "ip";
    el.textContent = ip;
    setStatus(proto, "ok", "connected");
    var btn = $("copy-" + proto);
    btn.disabled = false;
    btn.dataset.ip = ip;
    enrich(proto, ip);
  }

  function showNone(proto, msg) {
    var el = $("ip-" + proto);
    el.className = "ip none";
    el.textContent = msg;
    setStatus(proto, "err", proto === "v6" ? "not available" : "failed");
    $("copy-" + proto).disabled = true;
  }

  function lookup(proto) {
    var el = $("ip-" + proto);
    el.className = "ip loading";
    el.innerHTML = '<span class="spin"></span>&nbsp; resolving…';
    setStatus(proto, "", "checking…");
    $("copy-" + proto).disabled = true;
    $("details-" + proto).classList.remove("show");
    $("details-" + proto).innerHTML = "";

    fetchWithTimeout(ENDPOINTS[proto], TIMEOUT_MS)
      .then(function (data) {
        if (data && data.ip) showIp(proto, data.ip);
        else showNone(proto, proto === "v6" ? "No IPv6 detected" : "Unavailable");
      })
      .catch(function () {
        showNone(proto, proto === "v6" ? "No IPv6 on this network" : "Could not detect");
      });
  }

  function runAll() {
    lookup("v4");
    lookup("v6");
  }

  function wireCopy(proto) {
    var btn = $("copy-" + proto);
    btn.addEventListener("click", function () {
      var ip = btn.dataset.ip;
      if (!ip) return;
      (navigator.clipboard
        ? navigator.clipboard.writeText(ip)
        : Promise.reject()
      ).then(function () {
        var prev = btn.textContent;
        btn.textContent = "✓ Copied";
        btn.classList.add("copied");
        setTimeout(function () { btn.textContent = prev; btn.classList.remove("copied"); }, 1400);
      }).catch(function () {
        // fallback
        var ta = document.createElement("textarea");
        ta.value = ip; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(ta);
      });
    });
  }

  wireCopy("v4");
  wireCopy("v6");
  $("refresh").addEventListener("click", runAll);
  runAll();
})();
</script>
</body>
</html>
